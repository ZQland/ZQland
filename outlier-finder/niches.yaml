# Genres, keywords, platforms and thresholds.
# YouTube: each keyword costs ~100 of the free 10,000 daily API units, plus ~2 per new channel.
# TikTok / Instagram scrapers: Apify bills per result (results_per_keyword per keyword,
# plus each new creator's recent posts).

# Where data comes from, per platform:
#   official = the platform's own API (YouTube Data API; Instagram Business Discovery)
#   scraper  = Apify third-party scraper (TikTok, Instagram). Breaks those platforms'
#              terms of service: OK for personal research, risky in a product you sell.
#   off      = skip this platform
# Scans check your creator list (Creators page). Keyword search ("wide scan", a switch on the
# Scans page) runs on YouTube and TikTok only; Instagram is creator list only in both modes.
# TikTok has no official option for other creators' videos.
platforms:
  youtube: official
  tiktok: scraper
  instagram: scraper

# Apify spending guards (TikTok + Instagram scrapers bill per post fetched, ~$0.003-0.004 each).
apify:
  monthly_budget_usd: 5.0    # stop starting Apify runs once this month's usage reaches this
  max_usd_per_scan: 1.0      # one scan never spends more than this (Apify enforces it), split across platforms
  baseline_posts: 15         # posts fetched the first time a creator is looked up (for their median)
  refresh_posts: 6           # newest posts fetched on later scans; the median uses stored history
  refresh_hours: 20          # don't re-check a creator more often than this
  new_creators_per_scan: 15  # wide scan only: new creators looked up per platform per scan

analysis:
  model: claude-opus-5-5     # Claude model for script/format breakdowns
  effort: high               # low | medium | high | xhigh | max
  whisper_model: base        # tiny | base | small | medium | large-v3 (bigger = slower, more accurate)
  max_frames: 8              # video frames sent to Claude per analysis
  allow_downloads: true      # download videos (scraper links; yt-dlp for YouTube). false = uploads only

settings:
  lookback_days: 90          # only look at videos uploaded in this window
  results_per_keyword: 50    # results per keyword search (YouTube max 50)
  max_followers: 100000      # ignore creators bigger than this
  min_followers: 100         # ignore brand-new / empty accounts
  min_views: 10000           # ignore videos below this many views
  min_outlier_score: 3.0     # views ÷ creator median must be at least this
  shorts_only: true          # YouTube: only keep videos ≤ 180s (Shorts)
  channel_sample_size: 30    # recent posts used to compute a creator's median
  channel_cache_days: 7      # re-use creator medians for this many days
  language: en               # only keep videos in this language ("" = any). YouTube + TikTok; Instagram has no language data
  region: US                 # YouTube: rank search results for this country ("" = any)

genres:
  fitness:
    - fitness motivation
    - workout motivation
    - fitness journey
    - abs workout
    - full body workout
    - fitfam
    - common gym mistakes form tips
    - fat loss routine
    - weight loss routine
  content_creation:
    - content creator tips
    - how to go viral
    - grow on tiktok
    - content ideas
    - video hooks
    - ai tools for creators
    - youtube algorithm
    - ugc creator
    - video editing tips
    - monetize your content
  ai:
    - ai tools
    - chatgpt
    - ai video generator
    - ai art
    - ai avatar
    - faceless channel
    - ai automation
    - prompt engineering
    - ai news
    - ai side hustle
  finance:
    - personal finance
    - investing for beginners
    - passive income
    - side hustle
    - budgeting
    - stock market
    - financial freedom
    - credit score
    - real estate investing
    - crypto
